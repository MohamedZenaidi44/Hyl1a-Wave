<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hyl1a Stream — Musique & Vidéos</title>
<meta name="description" content="Hyl1a Stream — lecteur multimédia personnel, musique et vidéos, connecté à ton stockage Cloudflare." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/webp" href="assets/icons/SMG2_Luma.webp" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="bg-layer"></div>

<div class="aero-bubbles" aria-hidden="true">
  <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
  <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
  <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
  <span class="bubble"></span><span class="bubble"></span><span class="bubble"></span>
</div>

<div class="stage">

  <!-- ===== TOPBAR ===== -->
  <header class="topbar">
    <div class="topbar-logo">
      <span class="logo-orb">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M8 5v14l11-7z" fill="#1A1A1A"/>
        </svg>
      </span>
      <span class="logo-text">Hyl1a <strong>Stream</strong></span>
    </div>

    <nav class="topbar-tabs" id="topbar-tabs">
      <button class="tab active" data-tab="music" type="button">Musique</button>
      <button class="tab" data-tab="videos" type="button">Vidéos</button>
      <button class="tab" data-tab="playlists" type="button">Playlists</button>
    </nav>

    <div class="topbar-actions">
      <button class="icon-btn" type="button" title="Rechercher" aria-label="Rechercher">
        <img src="assets/icons/search.png" alt="" width="18" height="18" />
      </button>
      <button class="icon-btn account-btn" type="button" title="Compte" aria-label="Compte">
        <img src="assets/icons/account.png" alt="" width="20" height="20" />
      </button>
    </div>
  </header>

  <!-- ===== CONTENU PRINCIPAL ===== -->
  <main class="content">

    <section class="content-header">
      <div class="content-header-text">
        <h1 id="section-title">Ta bibliothèque</h1>
        <p id="section-subtitle">Tout ce que tu as envoyé sur ton espace Hyl1a, prêt à écouter.</p>
      </div>

      <div class="filter-pills" id="filter-pills">
        <button class="pill active" data-filter="all" type="button">Tout</button>
        <button class="pill" data-filter="recent" type="button">Récents</button>
        <button class="pill" data-filter="favorites" type="button">Favoris</button>
        <button class="pill" data-filter="albums" type="button">Albums</button>
      </div>
    </section>

    <section class="media-grid" id="media-grid" aria-live="polite">
      <!-- Les cartes médias sont générées par app.js -->
    </section>

  </main>

  <!-- ===== LECTEUR AUDIO ===== -->
  <footer class="player-bar">

    <div class="player-track">
      <div class="player-cover" id="player-cover">
        <img src="assets/icons/cover-default.png" alt="" width="26" height="26" />
      </div>
      <div class="player-info">
        <span class="player-title" id="player-title">Nuit Étoilée</span>
        <span class="player-artist" id="player-artist">Aïsha K.</span>
      </div>
      <button class="icon-btn like-btn" type="button" title="Ajouter aux favoris" aria-label="Ajouter aux favoris">
        <img src="assets/icons/favorite.png" alt="" width="17" height="17" />
      </button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" id="btn-shuffle" type="button" title="Lecture aléatoire" aria-label="Lecture aléatoire">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18 4 3 3-3 3M18 20l3-3-3-3M3 7h3.5a4 4 0 0 1 3.3 1.7L15 17a4 4 0 0 0 3.3 1.7H21M3 17h3.5a4 4 0 0 0 3.3-1.7l.6-.86M14.5 7.85l.5-.7A4 4 0 0 1 18.3 5.4H21"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btn-prev" type="button" title="Précédent" aria-label="Précédent">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M6 6h2v12H6zM10 12l9-6v12z"/>
          </svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="btn-play" type="button" title="Lecture" aria-label="Lecture">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1A1A1A" id="icon-play">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#1A1A1A" id="icon-pause" style="display:none">
            <path d="M7 5h4v14H7zM13 5h4v14h-4z"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btn-next" type="button" title="Suivant" aria-label="Suivant">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M16 6h2v12h-2zM5 6l9 6-9 6z"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btn-repeat" type="button" title="Répéter" aria-label="Répéter">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m17 2 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </div>

      <div class="player-progress">
        <span class="time-current" id="time-current">1:12</span>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill" style="width:32%"></div>
          <div class="progress-thumb" id="progress-thumb" style="left:32%"></div>
        </div>
        <span class="time-total" id="time-total">3:47</span>
      </div>
    </div>

    <div class="player-right">
      <div class="player-visualizer" id="visualizer" aria-hidden="true">
        <!-- Barres d'égaliseur générées par app.js -->
      </div>
      <div class="volume-control">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.7" title="Volume" aria-label="Volume" />
      </div>
    </div>

  </footer>

</div>

<audio id="audio-el" preload="none" crossorigin="anonymous"></audio>

<script src="app.js"></script>
</body>
</html>
