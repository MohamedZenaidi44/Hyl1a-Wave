<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyl1a Wave</title>

<style>
:root{
  --bg:#000;
  --pan:#121212;
  --el:#1f1f1f;
  --hov:#2a2a2a;
  --fg:#fff;
  --mu:#b3b3b3;
  --acc:#ff7a1a;
  padding-top:env(safe-area-inset-top,0px)
}

@media(prefers-color-scheme:light){
  :root{
    --bg:#e9e9ec;
    --pan:#fff;
    --el:#f1f1f4;
    --hov:#e4e4e9;
    --fg:#111;
    --mu:#666
  }
}

*{
  box-sizing:border-box;
  margin:0
}

html,
body{
  height:100%;
  min-height:0
}

@supports(height:100dvh){
  body{
    height:100dvh
  }
}

body{
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--fg);
  display:grid;
  grid-template-columns:280px 1fr 300px;
  grid-template-rows:minmax(0,1fr) 76px;
  gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom,0px));
  overflow:hidden
}

button{
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  cursor:pointer
}

button:focus-visible,
input:focus-visible{
  outline:2px solid var(--acc);
  outline-offset:2px
}

svg{
  width:20px;
  height:20px;
  fill:currentColor;
  flex:none
}

.p{
  background:var(--pan);
  border-radius:10px;
  overflow:auto;
  min-height:0
}

.cv{
  background:linear-gradient(135deg,var(--a),var(--b));
  border-radius:6px;
  flex:none;
  display:grid;
  place-items:center;
  font-weight:800;
  color:rgba(255,255,255,.55)
}

/* gauche */

.side{
  display:flex;
  flex-direction:column;
  gap:8px;
  background:none;
  overflow:hidden;
  min-height:0
}

.nav{
  background:var(--pan);
  border-radius:10px;
  padding:8px 12px;
  flex:none
}

.nav button{
  display:flex;
  gap:16px;
  align-items:center;
  width:100%;
  padding:10px 8px;
  font-weight:700;
  color:var(--mu)
}

.nav button:hover,
.nav button.on{
  color:var(--fg)
}

.lib{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden
}

.lib h3{
  padding:16px 16px 8px;
  font-size:15px;
  color:var(--mu)
}

.pills{
  display:flex;
  gap:8px;
  padding:0 16px 8px;
  flex-wrap:wrap
}

.pill{
  background:var(--el);
  padding:6px 12px;
  border-radius:99px;
  font-size:13px
}

.pill:hover{
  background:var(--hov)
}

.pill.on{
  background:var(--fg);
  color:var(--pan)
}

.libl{
  overflow:auto;
  padding:0 8px 8px;
  min-height:0
}

.li{
  display:flex;
  gap:12px;
  align-items:center;
  width:100%;
  padding:8px;
  border-radius:6px;
  text-align:left
}

.li:hover,
.li.selected{
  background:var(--el)
}

.li .cv{
  width:48px;
  height:48px
}

.li small,
.card small,
.tr small{
  color:var(--mu);
  display:block
}

/* centre */

.main{
  padding:0 24px 110px;
  position:relative;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:0;
  scroll-behavior:smooth
}

.top{
  position:sticky;
  top:0;
  z-index:3;
  display:flex;
  gap:12px;
  align-items:center;
  padding:16px 0;
  background:var(--pan)
}

.search{
  flex:1;
  max-width:380px;
  background:var(--el);
  border:0;
  border-radius:99px;
  padding:11px 18px;
  color:var(--fg);
  font:inherit
}

h1{
  font-size:28px;
  margin:4px 0 18px
}

h2{
  font-size:22px;
  margin:30px 0 14px
}

.quick{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px
}

.qt{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--el);
  border-radius:6px;
  overflow:hidden;
  text-align:left;
  font-weight:700;
  padding-right:8px
}

.qt:hover{
  background:var(--hov)
}

.qt .cv{
  width:56px;
  height:56px;
  border-radius:0
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px
}

.card{
  padding:12px;
  border-radius:8px;
  text-align:left;
  background:var(--el)
}

.card:hover{
  background:var(--hov)
}

.card .cv{
  aspect-ratio:1;
  width:100%;
  margin-bottom:12px;
  font-size:36px;
  box-shadow:0 6px 16px rgba(0,0,0,.35)
}

.card b{
  display:block
}

.tr{
  display:grid;
  grid-template-columns:32px 1fr 50px 50px;
  gap:12px;
  align-items:center;
  width:100%;
  padding:6px 12px;
  border-radius:6px;
  text-align:left
}

.tr:hover{
  background:var(--el)
}

.tr.on b{
  color:var(--acc)
}

.tr .n,
.tr .d{
  color:var(--mu)
}

.tr .t{
  display:flex;
  gap:12px;
  align-items:center;
  min-width:0
}

.tr .cv{
  width:40px;
  height:40px
}

.empty{
  color:var(--mu);
  padding:24px 0
}

/* Playlist */

.back{
  display:inline-flex;
  align-items:center;
  color:var(--mu);
  margin:8px 0 20px;
  padding:6px 0
}

.back:hover{
  color:var(--fg)
}

.playlist-head{
  display:flex;
  align-items:center;
  gap:20px;
  margin-bottom:28px
}

.playlist-head .cv{
  width:180px;
  height:180px;
  font-size:64px;
  border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)
}

.playlist-head small{
  color:var(--mu);
  font-weight:700;
  letter-spacing:1px
}

.playlist-head h1{
  margin:6px 0
}

.playlist-head p{
  color:var(--mu)
}

.playlist-tracks{
  padding-bottom:20px
}

/* droite */

.now{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  min-height:0
}

.now > .cv{
  width:100%;
  aspect-ratio:1;
  font-size:72px;
  border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)
}

.now h3{
  font-size:22px;
  line-height:1.2
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.q{
  font-weight:700;
  margin-top:6px
}

/* bas */

.bar{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  align-items:center;
  gap:16px;
  padding:0 12px;
  min-width:0;
  min-height:76px;
  background:var(--pan);
  border-radius:10px;
  z-index:20
}

.cur{
  display:flex;
  gap:12px;
  align-items:center;
  min-width:0
}

.cur .cv{
  width:56px;
  height:56px
}

.cur b,
.cur small{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.cur small{
  color:var(--mu);
  font-size:12px
}

.ctl{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  min-width:0
}

.btns{
  display:flex;
  align-items:center;
  gap:16px
}

.ic{
  color:var(--mu);
  display:grid;
  place-items:center;
  width:32px;
  height:32px
}

.ic:hover{
  color:var(--fg)
}

.ic.on{
  color:var(--acc)
}

.pp{
  background:var(--fg);
  color:var(--pan);
  border-radius:50%;
  width:36px;
  height:36px
}

.pp:hover{
  color:var(--pan);
  transform:scale(1.06)
}

.heart svg{
  fill:none;
  stroke:currentColor;
  stroke-width:2
}

.heart.on{
  color:var(--acc)
}

.heart.on svg{
  fill:var(--acc)
}

.seek{
  display:flex;
  gap:8px;
  align-items:center;
  width:100%;
  max-width:560px;
  font-size:11px;
  color:var(--mu)
}

input[type=range]{
  flex:1;
  accent-color:var(--acc);
  height:4px;
  cursor:pointer
}

.vol{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:flex-end;
  color:var(--mu)
}

.vol input{
  flex:none;
  width:100px
}

/* YouTube */

#yt{
  position:fixed;
  right:16px;
  bottom:96px;
  width:256px;
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
  z-index:30;
  box-shadow:0 8px 28px rgba(0,0,0,.5);
  display:none;
  background:#000
}

#yt.show{
  display:block
}

#yt iframe{
  width:100%;
  height:100%;
  border:0
}


/* ====== Ajouts : lignes de titres, actions, file d'attente ====== */

.libh{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-right:8px
}

.libh h3{
  padding-bottom:8px
}

.mu{
  color:var(--mu)
}

.ic.mini{
  width:28px;
  height:28px
}

.ic.mini svg{
  width:18px;
  height:18px
}

.ic[aria-pressed="true"]{
  color:var(--acc)
}

.rep{
  position:relative
}

.rep[data-mode="2"]::after{
  content:"1";
  position:absolute;
  right:3px;
  bottom:2px;
  font-size:9px;
  font-weight:800;
  line-height:1
}

.cv svg{
  width:42%;
  height:42%;
  fill:#fff
}

/* ligne de titre : un <div> contenant de vrais boutons */

.tr{
  grid-template-columns:32px minmax(0,1fr) minmax(0,.5fr) 32px 48px 32px;
  cursor:default
}

.tr .t{
  text-align:left;
  min-width:0
}

.tr b,
.li b{
  display:block
}

.tr b,
.tr small,
.li b,
.li small,
.qt{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.tr .al{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.li > span{
  min-width:0
}

.tr .d{
  text-align:right
}

.tr.q{
  grid-template-columns:28px minmax(0,1fr) auto
}

.tr.q.over{
  outline:2px dashed var(--acc);
  outline-offset:-2px
}

.tr.q[draggable="true"]{
  cursor:grab
}

.acts{
  display:flex;
  gap:2px
}

.tr .heart:not(.on){
  opacity:.7
}

.actions{
  display:flex;
  align-items:center;
  gap:12px;
  margin:-8px 0 20px
}

.pp.big{
  width:48px;
  height:48px;
  background:var(--acc);
  color:#111
}

.pp.big svg{
  width:24px;
  height:24px
}

.pp.big:hover{
  color:#111
}

.link{
  color:var(--mu);
  font-size:12px;
  text-decoration:underline
}

.link:hover{
  color:var(--fg)
}

.sub{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.curbtn{
  display:flex;
  gap:12px;
  align-items:center;
  min-width:0;
  text-align:left;
  flex:1
}

.curbtn > span:last-child{
  min-width:0;
  flex:1
}

.mprog{
  display:none
}

.vol input{
  width:clamp(60px,8vw,100px)
}

/* En cours de lecture (plein écran) */

.np{
  position:fixed;
  inset:0;
  z-index:50;
  background:var(--pan);
  display:flex;
  flex-direction:column;
  padding:max(12px,env(safe-area-inset-top,0px)) 20px max(16px,env(safe-area-inset-bottom,0px));
  overflow-y:auto
}

.np[hidden]{
  display:none
}

.np-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:700
}

.np-body{
  width:100%;
  max-width:440px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:18px;
  padding:12px 0
}

.np-art{
  width:min(100%,46vh);
  aspect-ratio:1;
  margin:0 auto;
  font-size:96px;
  border-radius:8px
}

.np-body h2{
  font-size:22px;
  margin:0;
  line-height:1.2
}

.np-body p{
  color:var(--mu)
}

.np-seek{
  max-width:none
}

.np-btns{
  justify-content:center;
  gap:22px
}

.np-btns .ic{
  width:40px;
  height:40px
}

.np-btns .pp{
  width:56px;
  height:56px
}

.np-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

/* Navigation basse (mobile) */

.tabs{
  display:none;
  grid-column:1/-1;
  background:var(--pan);
  border-radius:10px;
  z-index:20
}

.tabs button{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  padding:8px 4px;
  font-size:11px;
  color:var(--mu)
}

.tabs button.on{
  color:var(--fg)
}

/* Menu contextuel, boîte de dialogue, message */

#menu{
  position:fixed;
  z-index:70;
  min-width:220px;
  max-width:calc(100vw - 16px);
  background:var(--el);
  border:1px solid var(--hov);
  border-radius:8px;
  padding:4px;
  display:flex;
  flex-direction:column
}

#menu[hidden]{
  display:none
}

#menu button{
  text-align:left;
  padding:10px 12px;
  border-radius:6px
}

#menu button:hover,
#menu button:focus-visible{
  background:var(--hov)
}

#menu button.danger{
  color:#ff6b6b
}

dialog{
  margin:auto;
  border:1px solid var(--hov);
  border-radius:10px;
  background:var(--el);
  color:var(--fg);
  padding:20px;
  width:min(380px,calc(100vw - 32px))
}

dialog::backdrop{
  background:rgba(0,0,0,.6)
}

dialog h2{
  font-size:18px;
  margin:0 0 14px
}

dialog input{
  width:100%;
  background:var(--pan);
  color:var(--fg);
  border:1px solid var(--hov);
  border-radius:6px;
  padding:10px 12px;
  font:inherit
}

dialog ul{
  list-style:none;
  padding:0;
  display:grid;
  gap:6px
}

dialog li{
  display:flex;
  justify-content:space-between;
  gap:16px
}

dialog kbd{
  background:var(--pan);
  border-radius:4px;
  padding:1px 7px;
  font:inherit;
  color:var(--mu)
}

.dact{
  display:flex;
  flex-direction:row-reverse;
  gap:8px;
  margin-top:16px
}

#toast{
  position:fixed;
  left:50%;
  bottom:calc(110px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:var(--fg);
  color:var(--pan);
  padding:9px 16px;
  border-radius:99px;
  font-weight:700;
  z-index:80;
  opacity:0;
  pointer-events:none;
  max-width:calc(100vw - 32px)
}

#toast.show{
  opacity:1
}

.pill{
  display:inline-block
}


/* Le lecteur YouTube flottant ne doit pas masquer la fin du panneau de droite */
@media(min-width:1101px){
  body:has(#yt.show) .now{
    padding-bottom:176px
  }
}

/* Responsive */

@media(max-width:1100px){
  body{
    grid-template-columns:280px 1fr;
  }

  .now{
    display:none
  }
}

@media(max-width:760px){
  body{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1fr) auto auto;
    gap:6px
  }

  .side{
    display:none
  }

  .tabs{
    display:flex
  }

  .main{
    padding:0 14px 150px
  }

  .bar{
    grid-template-columns:minmax(0,1fr) auto;
    gap:8px;
    min-height:64px;
    position:relative;
    padding:0 8px 0 10px
  }

  .cur{
    min-width:0
  }

  .cur .cv{
    width:44px;
    height:44px
  }

  .seek,
  .vol{
    display:none
  }

  .np .seek,
  .np .vol{
    display:flex
  }

  .ctl .btns .hm{
    display:none
  }

  .btns{
    gap:8px
  }

  .mprog{
    display:block;
    position:absolute;
    left:10px;
    right:10px;
    bottom:3px;
    height:2px;
    background:var(--el);
    border-radius:2px;
    overflow:hidden
  }

  .mprog i{
    display:block;
    height:100%;
    width:0;
    background:var(--acc)
  }

  .tr{
    grid-template-columns:24px minmax(0,1fr) 32px 32px;
    padding:6px 4px
  }

  .tr .al,
  .tr > .d{
    display:none
  }

  #yt{
    width:190px;
    right:8px;
    bottom:calc(150px + env(safe-area-inset-bottom,0px))
  }

  body.np-open #yt{
    bottom:auto;
    top:calc(env(safe-area-inset-top,0px) + 56px);
    width:150px
  }

  #toast{
    bottom:calc(140px + env(safe-area-inset-bottom,0px))
  }

  #menu{
    left:0 !important;
    right:0;
    bottom:0;
    top:auto !important;
    max-width:none;
    border-radius:14px 14px 0 0;
    padding:8px 8px max(12px,env(safe-area-inset-bottom,0px))
  }

  #menu button{
    padding:14px 12px
  }

  .playlist-head .cv{
    width:120px;
    height:120px
  }

  .playlist-head{
    gap:14px
  }

  .playlist-head h1{
    font-size:22px
  }
}

body.np-open #yt{
  z-index:60
}
</style>
</head>

<body>

<aside class="side">

  <nav class="nav">
    <button id="nHome" class="on" data-nav="home">
      <i data-ic="home"></i>
      Accueil
    </button>

    <button id="nSearch" data-nav="search">
      <i data-ic="search"></i>
      Rechercher
    </button>
  </nav>

  <section class="p lib">
    <div class="libh">
      <h3>Ma bibliothèque</h3>
      <button class="ic" data-act="newpl" aria-label="Créer une playlist" title="Créer une playlist">
        <i data-ic="plus"></i>
      </button>
    </div>

    <div class="pills">
      <button class="pill on" data-k="all">Tout</button>
      <button class="pill" data-k="pl">Playlists</button>
      <button class="pill" data-k="ar">Artistes</button>
      <button class="pill" data-k="al">Albums</button>
    </div>

    <div class="libl" id="lib"></div>
  </section>

</aside>

<main class="p main">

  <div class="top">
    <input
      class="search"
      id="q"
      type="search"
      placeholder="Que veux-tu écouter ?"
      aria-label="Rechercher"
    >
  </div>

  <div id="view"></div>

</main>

<aside class="p now" id="now"></aside>

<footer class="bar">

  <div class="cur">
    <button class="curbtn" data-act="np" aria-label="Ouvrir « En cours de lecture »">
      <span class="cv" id="bCv"></span>
      <span style="min-width:0">
        <b id="bT"></b>
        <small id="bA"></small>
      </span>
    </button>

    <button class="ic heart" id="bLike" data-act="like" aria-label="Ajouter aux favoris" aria-pressed="false">
      <i data-ic="heart"></i>
    </button>
  </div>

  <div class="ctl">

    <div class="btns">
      <button class="ic hm" id="shuf" data-act="shuf" aria-label="Aléatoire" aria-pressed="false">
        <i data-ic="shuffle"></i>
      </button>

      <button class="ic" id="prev" data-act="prev" aria-label="Précédent">
        <i data-ic="prev"></i>
      </button>

      <button class="ic pp" id="pp" data-act="pp" aria-label="Lecture"></button>

      <button class="ic" id="next" data-act="next" aria-label="Suivant">
        <i data-ic="next"></i>
      </button>

      <button class="ic hm rep" id="rep" data-act="rep" aria-label="Répéter" aria-pressed="false">
        <i data-ic="repeat"></i>
      </button>
    </div>

    <div class="seek">
      <span class="tc" id="tc">0:00</span>
      <input class="sk" type="range" id="sk" min="0" max="100" step="1" value="0" aria-label="Progression">
      <span class="td" id="td">0:00</span>
    </div>

  </div>

  <div class="vol">
    <button class="ic" data-act="sleep" aria-label="Minuteur de sommeil" title="Minuteur de sommeil">
      <i data-ic="moon"></i>
    </button>
    <button class="ic" data-act="queue" aria-label="File d'attente" title="File d'attente">
      <i data-ic="queue"></i>
    </button>
    <button class="ic mute" data-act="mute" aria-label="Couper le son"></button>
    <input class="vl" type="range" id="vl" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
  </div>

  <div class="mprog" aria-hidden="true"><i id="mp"></i></div>

</footer>

<div id="yt">
  <div id="ytp"></div>
</div>

<nav class="tabs" aria-label="Navigation principale">
  <button data-nav="home" class="on"><i data-ic="home"></i><span>Accueil</span></button>
  <button data-nav="search"><i data-ic="search"></i><span>Recherche</span></button>
  <button data-nav="lib"><i data-ic="lib"></i><span>Bibliothèque</span></button>
  <button data-nav="fav"><i data-ic="heart"></i><span>Favoris</span></button>
</nav>

<section class="np" id="np" role="dialog" aria-modal="true" aria-label="En cours de lecture" hidden>
  <div class="np-top">
    <button class="ic" data-act="npclose" aria-label="Fermer"><i data-ic="down"></i></button>
    <span>En cours de lecture</span>
    <button class="ic" data-act="queue" aria-label="File d'attente"><i data-ic="queue"></i></button>
  </div>

  <div class="np-body">
    <div class="cv np-art" id="npCv"></div>

    <div class="row">
      <div style="min-width:0">
        <h2 id="npT"></h2>
        <p id="npA"></p>
      </div>
      <button class="ic heart" data-act="like" aria-label="Ajouter aux favoris" aria-pressed="false">
        <i data-ic="heart"></i>
      </button>
    </div>

    <div class="seek np-seek">
      <span class="tc">0:00</span>
      <input class="sk" type="range" min="0" max="100" step="1" value="0" aria-label="Progression">
      <span class="td">0:00</span>
    </div>

    <div class="btns np-btns">
      <button class="ic" data-act="shuf" aria-label="Aléatoire" aria-pressed="false"><i data-ic="shuffle"></i></button>
      <button class="ic" data-act="prev" aria-label="Précédent"><i data-ic="prev"></i></button>
      <button class="ic pp" data-act="pp" aria-label="Lecture"></button>
      <button class="ic" data-act="next" aria-label="Suivant"><i data-ic="next"></i></button>
      <button class="ic rep" data-act="rep" aria-label="Répéter" aria-pressed="false"><i data-ic="repeat"></i></button>
    </div>

    <div class="np-foot">
      <button class="ic" data-act="sleep" aria-label="Minuteur de sommeil"><i data-ic="moon"></i></button>
      <span id="sleepInfo" class="mu" aria-live="polite"></span>
      <div class="vol">
        <button class="ic mute" data-act="mute" aria-label="Couper le son"></button>
        <input class="vl" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      </div>
    </div>
  </div>
</section>

<div id="menu" role="menu" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>

</body>
